name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HabitTrack.slnx

      - name: Build
        run: dotnet build HabitTrack.slnx --no-restore --configuration Release -p:SourceRevisionId=${{ github.sha }}

      - name: Run tests
        run: dotnet test HabitTrack.slnx --no-build --configuration Release --verbosity normal

      # Only on pushes to main: publish the exact binaries that were just built and tested
      - name: Publish UserService
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish UserService/UserService.csproj --no-build --configuration Release --output ./publish/userservice

      - name: Upload UserService artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: userservice
          path: ./publish/userservice

      # No --no-build here: publishing rebuilds so the Functions worker SDK produces its function metadata
      - name: Publish MilestoneFunction
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish MilestoneFunction/MilestoneFunction.csproj --configuration Release --output ./publish/milestonefunction

      # include-hidden-files is required: the Functions publish output contains a hidden .azurefunctions
      # folder (the trigger/binding extensions), and upload-artifact skips dot-folders by default
      - name: Upload MilestoneFunction artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: milestonefunction
          path: ./publish/milestonefunction
          include-hidden-files: true

  # Works out which parts of the repo changed in this push, so each deploy only runs when relevant
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      userservice: ${{ steps.filter.outputs.userservice }}
      milestonefunction: ${{ steps.filter.outputs.milestonefunction }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            userservice:
              - 'UserService/**'
              - '.github/workflows/**'
            milestonefunction:
              - 'MilestoneFunction/**'
              - 'HabitService/**'
              - 'UserService/**'
              - '.github/workflows/**'

  deploy-userservice:
    # Runs only if build-and-test succeeded, only for pushes to main, and only if UserService changed
    needs: [build-and-test, changes]
    # Azure deploys are off by default. Set the repository variable AZURE_DEPLOY_ENABLED to 'true' to turn them on
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.userservice == 'true'
    # One deploy at a time, so two quick pushes cannot swap the slots in the wrong order
    concurrency:
      group: deploy-userservice
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job request an OIDC token for Azure login
      contents: read

    steps:
      - name: Download UserService artifact
        uses: actions/download-artifact@v4
        with:
          name: userservice
          path: ./publish/userservice

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: habit-tracker-userservice
          slot-name: staging
          package: ./publish/userservice

      # Waits until the staging slot reports the commit that was just deployed
      - name: Smoke test staging slot
        run: |
          host=$(az webapp show --name habit-tracker-userservice --resource-group habit-tracker-rg --slot staging --query defaultHostName -o tsv)
          url="https://${host}/health"
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 20 "$url" || true)
            echo "Attempt $i: $body"
            if echo "$body" | grep -q "${{ github.sha }}"; then
              echo "Staging is running commit ${{ github.sha }}"
              exit 0
            fi
            sleep 10
          done
          echo "Staging did not report the expected version"
          exit 1

      - name: Swap staging into production
        id: swap
        run: az webapp deployment slot swap --name habit-tracker-userservice --resource-group habit-tracker-rg --slot staging --target-slot production

      # /health touches no database, so this only proves the new code is now serving production traffic
      - name: Verify production after swap
        id: verify
        run: |
          host=$(az webapp show --name habit-tracker-userservice --resource-group habit-tracker-rg --query defaultHostName -o tsv)
          url="https://${host}/health"
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 20 "$url" || true)
            echo "Attempt $i: $body"
            if echo "$body" | grep -q "${{ github.sha }}"; then
              echo "Production is running commit ${{ github.sha }}"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not report the expected version"
          exit 1

      # If the swap went through but production is not healthy, swap back to the previous build
      - name: Roll back by swapping again
        if: failure() && steps.verify.outcome == 'failure'
        run: az webapp deployment slot swap --name habit-tracker-userservice --resource-group habit-tracker-rg --slot staging --target-slot production

  deploy-milestonefunction:
    # Same gate as the UserService deploy, but also redeploys when HabitService or UserService change,
    # because the function compiles those two projects in through its project references
    needs: [build-and-test, changes]
    # Azure deploys are off by default. Set the repository variable AZURE_DEPLOY_ENABLED to 'true' to turn them on
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.milestonefunction == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download MilestoneFunction artifact
        uses: actions/download-artifact@v4
        with:
          name: milestonefunction
          path: ./publish/milestonefunction

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: habit-tracker-milestonefunc
          package: ./publish/milestonefunction