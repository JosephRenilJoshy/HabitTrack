name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HabitTrack.slnx

      - name: Build
        run: dotnet build HabitTrack.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test HabitTrack.slnx --no-build --configuration Release --verbosity normal

      # Only on pushes to main: publish the exact binaries that were just built and tested
      - name: Publish UserService
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish UserService/UserService.csproj --no-build --configuration Release --output ./publish/userservice

      - name: Upload UserService artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: userservice
          path: ./publish/userservice

  deploy-userservice:
    # Runs only if build-and-test succeeded, and only for pushes to main (never for pull requests)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job request an OIDC token for Azure login
      contents: read

    steps:
      - name: Download UserService artifact
        uses: actions/download-artifact@v4
        with:
          name: userservice
          path: ./publish/userservice

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: habit-tracker-userservice
          package: ./publish/userservice